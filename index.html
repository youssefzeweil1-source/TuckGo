<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TukGo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{--ink:#17252b;--muted:#71807a;--green:#0b8f68;--green2:#e8f7f0;--line:#e2ebe6;--bg:#f7f9f7;--card:#fff;--orange:#b07116;--orangeBg:#fff4de;--red:#d76752;--shadow:0 16px 45px rgba(21,58,44,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
    .topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:999}
    .logo{font-weight:900;font-size:25px;letter-spacing:-1px}.logo span{color:var(--green)}
    .live{display:flex;gap:8px;align-items:center;color:#087252;background:var(--green2);font-size:12px;font-weight:800;padding:8px 12px;border-radius:20px}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
    .layout{max-width:1220px;margin:auto;padding:28px 20px 60px}
    .shell{display:grid;grid-template-columns:240px 1fr;gap:25px;direction:ltr}
    .sidebar,.main{direction:rtl}
    .sidebar{background:#18342b;color:#fff;border-radius:24px;padding:22px;height:max-content;position:sticky;top:95px}
    .side-brand{font-size:23px;font-weight:900;margin-bottom:28px}.side-brand span{color:#62d2ad}
    .nav{display:grid;gap:8px}.nav button{background:transparent;color:#d0e5dc;text-align:right;padding:12px;border-radius:12px}
    .nav button.active,.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
    .sidebar-note{font-size:11px;line-height:1.8;color:#a8c8bb;border-top:1px solid rgba(255,255,255,.15);margin-top:28px;padding-top:18px}
    .hero{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px}
    .eyebrow{color:var(--green);font-size:12px;font-weight:900;margin-bottom:5px}
    .h1{font-size:32px;margin:0;font-weight:900}.sub{color:var(--muted);font-size:13px;line-height:1.8;margin:7px 0 0}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 18px rgba(21,58,44,.025)}
    .stat-num{font-size:25px;font-weight:900;color:var(--green)}.stat-label{font-size:11px;color:var(--muted);margin-top:5px}
    .section{margin-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
    .section-title{font-size:19px;margin:0;font-weight:900}
    .section-tag{font-size:11px;background:var(--orangeBg);color:var(--orange);padding:6px 10px;border-radius:20px;font-weight:800}
    .input,.select{border:1px solid var(--line);border-radius:11px;padding:11px 12px;width:100%;outline:none;background:#fbfdfc;color:var(--ink)}
    .input:focus{border-color:var(--green)}
    .btn{padding:12px 16px;border-radius:11px;font-size:12px;font-weight:900;transition:.16s}
    .btn:active{transform:scale(.97)}.btn.primary{background:var(--green);color:#fff}
    .btn.secondary{background:#eff7f3;color:#087252}.btn.outline{border:1px solid var(--line);background:#fff;color:#60736b}
    .btn.warn{background:var(--orangeBg);color:var(--orange)}.btn.danger{background:#fff0ed;color:var(--red)}
    .btn.full{width:100%}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .offer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.offers{display:grid;gap:10px}
    .avatar{width:44px;height:44px;border-radius:14px;background:#ddf2e9;color:var(--green);display:grid;place-items:center;font-size:18px;font-weight:900;flex:none}
    .offer-main{flex:1;min-width:150px}.offer-name{font-weight:900;font-size:13px}
    .meta{color:var(--muted);font-size:10px;margin-top:5px}.price{font-size:18px;font-weight:900}
    .notice{background:var(--orangeBg);border:1px solid #f2d79e;border-radius:14px;padding:12px;color:#855818;font-size:12px;line-height:1.8}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .badge{font-size:10px;font-weight:900;padding:6px 9px;border-radius:20px;background:#e8f7f0;color:#087252;display:inline-block}
    .badge.orange{background:var(--orangeBg);color:var(--orange)}.badge.red{background:#fff0ed;color:var(--red)}
    .toast{position:fixed;bottom:22px;left:22px;background:#17362b;color:#fff;padding:13px 16px;border-radius:12px;font-size:12px;box-shadow:var(--shadow);z-index:9999;max-width:90%}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 10%,#dff5eb 0,transparent 34%),var(--bg)}
    .login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:25px;padding:28px;box-shadow:var(--shadow);text-align:center}
    .login-logo{width:68px;height:68px;background:var(--green);color:#fff;border-radius:22px;display:grid;place-items:center;margin:0 auto 14px;font-size:22px;font-weight:900;transform:rotate(-7deg)}
    .login-card h1{margin:0;font-size:30px}.login-card h1 span{color:var(--green)}
    .role-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 14px}
    .role{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}
    .role.active{border-color:var(--green);background:var(--green2)}
    .role strong{display:block}.role small{color:var(--muted);font-size:10px}
    .muted-note{font-size:10px;color:var(--muted);line-height:1.7;margin-top:12px}
    .footer-note{font-size:10px;color:#9aa9a1;text-align:center;margin-top:25px}
    #map{height:420px;border-radius:20px;overflow:hidden;border:1px solid #cde0d6;background:#dcece4}
    .map-sm{height:280px!important}
    .switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
    .switch input{display:none}
    .switch .track{width:50px;height:28px;background:#cfe0d8;border-radius:20px;position:relative;transition:.2s}
    .switch .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
    .switch input:checked + .track{background:var(--green)}
    .switch input:checked + .track::after{left:25px}
    .loc-chip{display:inline-flex;align-items:center;gap:6px;background:#f1f8f4;border:1px solid #d7e8df;color:#2a5244;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700}
    @media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:static}.nav{grid-template-columns:repeat(3,1fr)}.sidebar-note{display:none}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.h1{font-size:25px}.sidebar{padding:15px;border-radius:18px}.side-brand{margin-bottom:14px}.nav button{font-size:11px;padding:9px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast hidden"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getDatabase, ref, set, push, update, remove, onValue, onChildAdded, onChildChanged, off, serverTimestamp, get } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

    const firebaseConfig = { apiKey:"AIzaSyBqWgXZHVd4BXJIJ6FyOlA5DUOEMqsLruY", authDomain:"tukgo-c906b.firebaseapp.com", databaseURL:"https://tukgo-c906b-default-rtdb.europe-west1.firebasedatabase.app", projectId:"tukgo-c906b", storageBucket:"tukgo-c906b.firebasestorage.app", messagingSenderId:"789724866023", appId:"1:789724866023:web:a58bc13a0353ab19ac0942", measurementId:"G-YN6TCMFXC5" };
    const CLOUDINARY_CLOUD_NAME = 'dv1w1yen4';
    const CLOUDINARY_UPLOAD_PRESET = 'default_media_library_upload_preset_31c26b2c857f';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const googleProvider = new GoogleAuthProvider();

    // ---------- STATE ----------
    let session = JSON.parse(localStorage.getItem('tukgo-session') || 'null');
    let currentView = 'overview';
    let selectedRole = 'rider';
    let currentLocation = null;
    let selectedDestination = null;
    let mapInstance = null;
    let myMarker = null;
    let destMarker = null;
    let driverMarkers = {};
    let watchId = null;
    let lastLocWrite = 0;
    let activeRideId = null;
    let activeRide = null;
    let isOnline = false;
    let chosenStars = 0;
    const chosenTags = new Set();
    const activeListeners = [];
    const DRIVER_PLANS = { weekly:{title:'أسبوعي',amount:'40 جنيه لأول اشتراك ثم 50 جنيه'}, monthly:{title:'شهري',amount:'200 جنيه'}, yearly:{title:'سنوي ترويجي',amount:'2000 جنيه'} };

    async function uploadToCloudinary(file, folder, uid) {
      if (!file) throw new Error('missing-file');
      const form = new FormData();
      form.append('file', file);
      form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
      form.append('folder', `tukgo/${folder}/${uid}`);
      const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method:'POST', body:form });
      if (!response.ok) throw new Error('cloudinary-upload-failed');
      return (await response.json()).secure_url;
    }

    // ---------- HELPERS ----------
    const $ = (q) => document.querySelector(q);
    const $$ = (q) => [...document.querySelectorAll(q)];
    const esc = (x) => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

    function toast(msg, ms=2600){
      const el = $('#toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.add('hidden'), ms);
    }

    function addListener(path, type, cb) {
      const r = ref(db, path);
      const fn = type === 'value' ? onValue
                : type === 'child_added' ? onChildAdded
                : type === 'child_changed' ? onChildChanged
                : onValue;
      fn(r, cb);
      activeListeners.push({ r, type, cb });
    }
    function clearListeners() {
      activeListeners.forEach(l => { try { off(l.r, l.type, l.cb); } catch {} });
      activeListeners.length = 0;
    }

    async function reverseGeocode(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`, { headers: { 'Accept':'application/json' } });
        const data = await res.json();
        return data.display_name || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      } catch { return `${lat.toFixed(5)}, ${lng.toFixed(5)}`; }
    }

    function haversineKm(a, b) {
      const R = 6371, dLat = (b.lat - a.lat) * Math.PI/180, dLng = (b.lng - a.lng) * Math.PI/180;
      const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLng/2)**2;
      return 2 * R * Math.asin(Math.sqrt(s));
    }

    // ---------- GPS ----------
    function startGpsWatch() {
      if (watchId !== null) return;
      if (!navigator.geolocation) return toast('المتصفح لا يدعم تحديد الموقع');
      watchId = navigator.geolocation.watchPosition(
        (pos) => onLocationUpdate({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
        (err) => { console.warn('GPS', err); if (err.code === 1) toast('لازم تسمح بالوصول للموقع'); },
        { enableHighAccuracy: true, maximumAge: 4000, timeout: 20000 }
      );
    }

    function onLocationUpdate(loc) {
      currentLocation = loc;
      if (myMarker && mapInstance) myMarker.setLatLng([loc.lat, loc.lng]);
      if (mapInstance && !mapInstance._hasCentered) {
        mapInstance.setView([loc.lat, loc.lng], 15);
        mapInstance._hasCentered = true;
      }
      if (session?.accountType === 'driver' && isOnline) {
        const now = Date.now();
        if (now - lastLocWrite > 5000) {
          lastLocWrite = now;
          set(ref(db, `drivers/${session.uid}/location`), {
            lat: loc.lat, lng: loc.lng, updatedAt: serverTimestamp()
          }).catch(()=>{});
        }
      }
    }

    // ---------- MAP ----------
    function initMap(containerId, center, onClick) {
      const el = document.getElementById(containerId);
      if (!el) return null;
      if (mapInstance) { try { mapInstance.remove(); } catch {} mapInstance = null; }
      myMarker = null; destMarker = null; driverMarkers = {};

      mapInstance = L.map(containerId, { zoomControl: true }).setView([center.lat, center.lng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(mapInstance);

      if (currentLocation) {
        myMarker = L.circleMarker([currentLocation.lat, currentLocation.lng], {
          radius: 9, color: '#fff', weight: 3, fillColor: '#0b8f68', fillOpacity: 1
        }).addTo(mapInstance).bindTooltip('أنت هنا');
        mapInstance._hasCentered = true;
      } else {
        mapInstance._hasCentered = false;
      }

      if (typeof onClick === 'function') {
        mapInstance.on('click', (e) => onClick(e.latlng));
      }
      return mapInstance;
    }

    function setDestinationMarker(lat, lng) {
      if (!mapInstance) return;
      if (destMarker) destMarker.setLatLng([lat, lng]);
      else destMarker = L.circleMarker([lat, lng], {
        radius: 9, color: '#fff', weight: 3, fillColor: '#f06b4f', fillOpacity: 1
      }).addTo(mapInstance).bindTooltip('الوجهة');
    }

    function renderDriverMarkers(drivers) {
      if (!mapInstance) return;
      const seen = new Set();
      Object.entries(drivers || {}).forEach(([uid, d]) => {
        if (!d?.location) return;
        seen.add(uid);
        const pos = [d.location.lat, d.location.lng];
        if (driverMarkers[uid]) driverMarkers[uid].setLatLng(pos);
        else {
          driverMarkers[uid] = L.marker(pos, {
            icon: L.divIcon({ className:'', html:`<div style="width:26px;height:26px;background:#0b8f68;border:3px solid #fff;border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.3)"></div>`, iconSize:[26,26], iconAnchor:[13,13] })
          }).addTo(mapInstance).bindTooltip(d.name || 'سائق');
        }
      });
      Object.keys(driverMarkers).forEach(uid => {
        if (!seen.has(uid)) { mapInstance.removeLayer(driverMarkers[uid]); delete driverMarkers[uid]; }
      });
    }

    // ---------- LOGIN ----------
    function loginScreen(){
      return `<div class="login-wrap"><div class="login-card">
        <div class="login-logo">TG</div>
        <h1>Tuk<span>Go</span></h1>
        <p class="sub">مشوارك أسرع وأسهل بالتوك توك</p>
        <div class="role-choice">
          <button class="role ${selectedRole==='rider'?'active':''}" data-role="rider"><strong>راكب</strong><small>أطلب مشوار</small></button>
          <button class="role ${selectedRole==='driver'?'active':''}" data-role="driver"><strong>سائق</strong><small>استقبل رحلات</small></button>
        </div>
        <button id="googleBtn" class="btn primary full">المتابعة باستخدام Google</button>
        <p class="muted-note">لما تدوس، هنطلب منك تسمح بالوصول لموقعك علشان نحدد مكانك على الخريطة.</p>
      </div></div>`;
    }

    async function handleGoogleLogin() {
      try {
        const result = await signInWithPopup(auth, googleProvider);
        const user = result.user;
        const name = user.displayName || user.email || 'مستخدم';
        // check if user exists
        const snap = await get(ref(db, `users/${user.uid}`));
        if (snap.exists()) {
          const data = snap.val();
          session = { uid: user.uid, name: data.name || name, accountType: data.accountType || selectedRole };
        } else {
          await set(ref(db, `users/${user.uid}`), {
            uid: user.uid, name, accountType: selectedRole,
            status: selectedRole === 'driver' ? 'pending_documents' : 'active',
            provider: 'google', createdAt: serverTimestamp(), updatedAt: serverTimestamp()
          });
          session = { uid: user.uid, name, accountType: selectedRole };
        }
        localStorage.setItem('tukgo-session', JSON.stringify(session));
        startGpsWatch();
        render();
        toast('تم تسجيل الدخول');
      } catch (e) {
        console.error(e);
        if (String(e.code).includes('unauthorized-domain')) toast('النطاق مش مضاف في Firebase Authorized domains');
        else if (String(e.code).includes('popup-closed')) toast('اتقفلت نافذة تسجيل الدخول');
        else toast('فشل تسجيل الدخول: ' + (e.code || e.message));
      }
    }

    function signOutUser() {
      if (watchId !== null) { try { navigator.geolocation.clearWatch(watchId); } catch {} watchId = null; }
      if (session?.uid && session?.accountType === 'driver') {
        set(ref(db, `drivers/${session.uid}/online`), false).catch(()=>{});
      }
      clearListeners();
      try { signOut(auth); } catch {}
      localStorage.removeItem('tukgo-session');
      session = null; activeRideId = null; activeRide = null; isOnline = false;
      render();
    }

    // ---------- HEADER / NAV ----------
    function nav(){
      const items = session.accountType === 'driver'
        ? [['overview','الرئيسية'],['onboarding','ملفي']]
        : [['overview','اطلب رحلة'],['bidding','عروضي'],['tracking','تتبع']];
      return `<aside class="sidebar">
        <div class="side-brand">Tuk<span>Go</span></div>
        <div class="nav">${items.map(([id,label])=>`<button class="${currentView===id?'active':''}" data-view="${id}">${label}</button>`).join('')}</div>
        <div style="margin-top:20px"><button class="btn outline full" id="logoutBtn">تسجيل خروج</button></div>
        <div class="sidebar-note">الدفع نقدًا. لا توجد عمولة.<br/>Firebase: <b>tukgo-c906b</b></div>
      </aside>`;
    }

    function header(title, sub){
      return `<div class="hero"><div>
        <div class="eyebrow">${session.accountType==='driver'?'مساحة السائق':'تطبيق العملاء'}</div>
        <h1 class="h1">${title}</h1><p class="sub">${sub}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
        <div class="live"><i class="dot"></i>${esc(session.name)}</div>
        <div class="loc-chip" id="locChip">${currentLocation ? `📍 ${currentLocation.lat.toFixed(4)}, ${currentLocation.lng.toFixed(4)}` : '📍 جاري تحديد موقعك...'}</div>
      </div></div>`;
    }

    // ---------- RIDER VIEWS ----------
    function riderOverview(){
      return `<section>
        ${header('اطلب مشوارك','اضغط على الخريطة علشان تحدد الوجهة، وبعدين اكتب السعر واطلب.')}
        <div class="card">
          <div id="map" class="map"></div>
          <div class="two" style="margin-top:14px">
            <div>
              <label class="eyebrow">الوجهة</label>
              <div class="input" id="destText" style="min-height:42px;display:flex;align-items:center;color:#60736b">اضغط على الخريطة لتحديد الوجهة</div>
            </div>
            <div>
              <label class="eyebrow">السعر المقترح (جنيه كاش)</label>
              <input id="bidPrice" class="input" type="number" value="35" min="5" />
            </div>
          </div>
          <button class="btn primary full" style="margin-top:13px" id="publishRide">اطلب الرحلة للسواقين القريبين</button>
        </div>
        <section class="section">
          <div class="section-head"><h2 class="section-title">السواقين المتصلين دلوقتي</h2><span class="section-tag">لايف</span></div>
          <div id="nearbyDrivers" class="offers"><div class="card"><p class="sub">جاري البحث عن سواقين قريبين...</p></div></div>
        </section>
      </section>`;
    }

    function riderBidding(){
      return `<section>
        ${header('عروض السواقين','العروض بتوصلك لايف. اقبل العرض اللي يناسبك.')}
        <div class="notice" id="rideSummary">${activeRide ? `رحلتك: <b>${esc(activeRide.pickupAddress||'موقعك')}</b> ← <b>${esc(activeRide.dropoffAddress||'الوجهة')}</b> · سعرك المقترح <b>${activeRide.suggestedPrice} جنيه</b>` : 'لا توجد رحلة نشطة'}</div>
        <div class="offers section" id="offersList"><div class="card"><p class="sub">في انتظار عروض السواقين...</p></div></div>
      </section>`;
    }

    function riderTracking(){
      if (!activeRide) return `<section>${header('تتبع الرحلة','لا توجد رحلة نشطة حالياً.')}<div class="card"><p class="sub">اطلب رحلة من الشاشة الرئيسية.</p></div></section>`;
      return `<section>
        ${header('تتبع الرحلة','السائق في الطريق إليك. الخريطة بتتحدث لايف.')}
        <div class="card">
          <div id="map" class="map"></div>
          <div class="two" style="margin-top:14px">
            <div class="card" style="box-shadow:none;border:1px dashed #cde0d6">
              <div class="eyebrow">السائق</div>
              <div class="offer-name" id="trackDriverName">${esc(activeRide.driverName||'—')}</div>
              <div class="meta" id="trackDistance">جاري حساب المسافة...</div>
            </div>
            <div class="card" style="box-shadow:none;border:1px dashed #cde0d6">
              <div class="eyebrow">السعر المتفق عليه</div>
              <div class="price" style="color:var(--green)">${activeRide.agreedPrice || activeRide.suggestedPrice} ج</div>
              <div class="meta">كاش عند الوصول</div>
            </div>
          </div>
          <div id="trackStatus" class="notice" style="margin-top:14px">الحالة: ${esc(activeRide.status)}</div>
        </div>
      </section>`;
    }

    // ---------- DRIVER VIEWS ----------
    function driverOverview(){
      return `<section>
        ${header('أهلاً يا سائق','فعّل الاتصال علشان تستقبل طلبات الرحلات من الركاب القريبين.')}
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
          <div>
            <div class="eyebrow">حالة الاتصال</div>
            <div class="offer-name" id="onlineLabel">${isOnline ? 'متصل — بتستقبل طلبات' : 'غير متصل'}</div>
            <div class="meta">لما تكون متصل، موقعك بيتحدث تلقائي كل ~5 ثواني.</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="onlineToggle" ${isOnline?'checked':''} />
            <span class="track"></span>
          </label>
        </div>
        <div class="card section">
          <div id="map" class="map"></div>
        </div>
        <section class="section">
          <div class="section-head"><h2 class="section-title">طلبات الرحلات المتاحة</h2><span class="section-tag">لايف</span></div>
          <div id="openRides" class="offers"><div class="card"><p class="sub">جاري تحميل الطلبات...</p></div></div>
        </section>
      </section>`;
    }

    function driverOnboarding(){
      const planOptions = Object.entries(DRIVER_PLANS).map(([id,p]) => `<option value="${id}">${p.title} — ${p.amount}</option>`).join('');
      return `<section>${header('ملفي كسائق','لن يتم تفعيل الحساب أو استقبال الرحلات قبل مراجعة الإدارة.')}
        <div class="notice">الدفع خارج التطبيق على رقم Vodafone Cash الخاص بصاحب المشروع، ثم ارفع صورة الإيصال. الإدارة تفتح الحساب يدويًا بعد المراجعة.</div>
        <div class="card section"><div class="two"><div><label class="eyebrow">الاسم بالكامل</label><input class="input" value="${esc(session.name)}" readonly/></div><div><label class="eyebrow">تاريخ الميلاد</label><input id="driverBirthDate" class="input" type="date"/><div class="meta">يشترط ألا يقل العمر عن 18 سنة.</div></div></div>
        <div class="two section"><div><label class="eyebrow">الباقة</label><select id="driverPlan" class="select">${planOptions}</select></div><div><label class="eyebrow">رقم عملية Vodafone Cash</label><input id="driverTransactionId" class="input" placeholder="اختياري"/></div></div>
        <div class="two section"><div><label class="eyebrow">رقم التحويل</label><div class="input">01014761698</div></div><div><label class="eyebrow">إيصال الدفع</label><input id="driverReceipt" class="input" type="file" accept="image/*"/></div></div>
        <div class="section"><div class="eyebrow">مستندات التسجيل</div><div class="two"><input id="nationalId" class="input" type="file" accept="image/*,.pdf" placeholder="بطاقة الرقم القومي"/><input id="criminalRecord" class="input" type="file" accept="image/*,.pdf" placeholder="الفيش والتشبيه"/><input id="tukTukOwnership" class="input" type="file" accept="image/*,.pdf" placeholder="عقد الملكية أو المبايعة"/><input id="driverPhoto" class="input" type="file" accept="image/*" placeholder="الصورة الشخصية"/></div></div>
        <label style="display:flex;gap:8px;align-items:flex-start;margin-top:16px;font-size:12px"><input id="driverTerms" type="checkbox"/> أوافق على شروط TukGo: الاحترام والقيادة الآمنة، وأفهم أن الحظر النهائي بسبب إساءة أو شكوى أمان خطيرة يجمّد الحساب ولا يحق معه استرداد الاشتراك المدفوع مقدمًا.</label>
        <button id="submitDriver" class="btn primary full" style="margin-top:15px">رفع الأوراق وإرسال الطلب</button><p id="driverSubmitStatus" class="meta"></p></div></section>`;
    }

    async function bindDriverOnboarding(){
      const button=$('#submitDriver'); if(!button) return;
      button.onclick=async()=>{
        const dob=$('#driverBirthDate')?.value; const age=dob ? (Date.now()-new Date(dob).getTime())/31557600000 : 0;
        if(!dob || age<18) return toast('لا يمكن التسجيل: يجب أن يكون العمر 18 سنة أو أكثر');
        if(!$('#driverTerms')?.checked) return toast('وافق على شروط TukGo أولًا');
        const receipt=$('#driverReceipt')?.files?.[0]; if(!receipt) return toast('ارفع صورة إيصال Vodafone Cash أولًا');
        button.disabled=true; button.textContent='جاري رفع الملفات...';
        try{
          const uid=session.uid; const planId=$('#driverPlan').value; const plan=DRIVER_PLANS[planId];
          const receiptUrl=await uploadToCloudinary(receipt,'subscription-receipts',uid);
          const docs={};
          for(const [id,key] of [['nationalId','nationalIdUrl'],['criminalRecord','criminalRecordUrl'],['tukTukOwnership','tukTukOwnershipUrl'],['driverPhoto','driverPhotoUrl']]){const f=$('#'+id)?.files?.[0];if(f)docs[key]=await uploadToCloudinary(f,'driver-documents',uid)}
          await update(ref(db,`users/${uid}`),{status:'pending_documents',birthDate:dob,updatedAt:serverTimestamp(),...docs});
          await set(ref(db,`subscriptions/${uid}`),{uid,name:session.name,plan:planId,amount:plan.amount,transactionId:$('#driverTransactionId').value.trim(),receiptUrl,status:'pending',submittedAt:serverTimestamp(),updatedAt:serverTimestamp()});
          button.textContent='تم إرسال الطلب للمراجعة'; $('#driverSubmitStatus').textContent='الإدارة ستراجع الأوراق والإيصال ثم تفعّل الحساب يدويًا.'; toast('تم رفع الإيصال والأوراق بنجاح');
        }catch(e){console.error(e);button.disabled=false;button.textContent='رفع الأوراق وإرسال الطلب';toast('تعذر الرفع. تأكد من إعداد Cloudinary وقواعد Firebase')}
      };
    }

    // ---------- RENDER ----------
    function render(){
      clearListeners();

      if (!session) {
        $('#app').innerHTML = loginScreen();
        bindLogin();
        return;
      }

      $('#app').innerHTML = `
        <div class="topbar">
          <div class="logo">Tuk<span>Go</span></div>
          <div class="live"><i class="dot"></i>${esc(session.name)} · ${session.accountType==='driver'?'سائق':'راكب'}</div>
        </div>
        <main class="layout">
          <div class="shell">
            ${nav()}
            <div class="main">
              ${renderView()}
              <div class="footer-note">TukGo · GPS مباشر · Firebase + Cloudinary</div>
            </div>
          </div>
        </main>`;

      $('#logoutBtn')?.addEventListener('click', signOutUser);
      bindNav();
      bindView();
    }

    function renderView(){
      if (session.accountType === 'driver') {
        if (currentView === 'onboarding') return driverOnboarding();
        if (currentView === 'tracking') return driverTracking();
        return driverOverview();
      }
      if (currentView === 'bidding') return riderBidding();
      if (currentView === 'tracking') return riderTracking();
      return riderOverview();
    }

    function bindNav(){
      $$('.nav button').forEach(b => b.onclick = () => { currentView = b.dataset.view; render(); });
    }

    function bindLogin(){
      $$('.role').forEach(b => b.onclick = () => { selectedRole = b.dataset.role; render(); });
      $('#googleBtn').onclick = handleGoogleLogin;
    }

    // ---------- BIND VIEW ----------
    function bindView(){
      if (!currentLocation) {
        startGpsWatch();
        const iv = setInterval(() => {
          if (currentLocation) { clearInterval(iv); render(); }
        }, 800);
        setTimeout(() => clearInterval(iv), 15000);
      }

      if (session.accountType === 'driver') bindDriverViews();
      else bindRiderViews();
    }

    // ============ RIDER BIND ============
    function bindRiderViews(){
      if (currentView === 'overview') {
        if (!currentLocation) {
          const iv = setInterval(() => { if (currentLocation) { clearInterval(iv); render(); } }, 700);
          setTimeout(() => clearInterval(iv), 15000);
          return;
        }
        initMap('map', currentLocation, async (latlng) => {
          selectedDestination = { lat: latlng.lat, lng: latlng.lng };
          setDestinationMarker(latlng.lat, latlng.lng);
          const el = $('#destText');
          if (el) el.textContent = '📍 جاري تحديد العنوان...';
          const addr = await reverseGeocode(latlng.lat, latlng.lng);
          selectedDestination.address = addr;
          if (el) el.textContent = addr;
        });
        setDestinationMarker(currentLocation.lat, currentLocation.lng);
        if (destMarker) destMarker.setStyle({opacity:0});
        destMarker = null;

        // live drivers on map
        addListener('drivers', 'value', (snap) => {
          const drivers = snap.val() || {};
          const now = Date.now();
          const active = {};
          Object.entries(drivers).forEach(([uid,d]) => {
            if (d?.online && d?.location?.lat) active[uid] = d;
          });
          renderDriverMarkers(active);

          // Nearby list
          const list = Object.entries(active).map(([uid,d]) => {
            const km = currentLocation ? haversineKm(currentLocation, d.location).toFixed(2) : '—';
            return `<div class="card offer">
              <div class="avatar">${esc((d.name||'س')[0])}</div>
              <div class="offer-main">
                <div class="offer-name">${esc(d.name||'سائق')}</div>
                <div class="meta">يبعد عنك ${km} كم · متصل الآن</div>
              </div>
            </div>`;
          });
          const el = $('#nearbyDrivers');
          if (el) el.innerHTML = list.length ? list.join('') : '<div class="card"><p class="sub">لا يوجد سواقين متصلين قريبين دلوقتي.</p></div>';
        });

        $('#publishRide').onclick = async () => {
          if (!currentLocation) return toast('لسه بنحدد موقعك، استنى لحظة');
          if (!selectedDestination) return toast('اضغط على الخريطة لتحديد الوجهة');
          const price = Number($('#bidPrice').value);
          if (!price || price < 5) return toast('اكتب سعر صحيح');
          try {
            const rideRef = push(ref(db, 'rides'));
            const ride = {
              riderId: session.uid,
              riderName: session.name,
              pickup: { lat: currentLocation.lat, lng: currentLocation.lng },
              dropoff: { lat: selectedDestination.lat, lng: selectedDestination.lng },
              pickupAddress: await reverseGeocode(currentLocation.lat, currentLocation.lng),
              dropoffAddress: selectedDestination.address || `${selectedDestination.lat.toFixed(4)}, ${selectedDestination.lng.toFixed(4)}`,
              suggestedPrice: price,
              status: 'open',
              payment: 'cash',
              createdAt: serverTimestamp()
            };
            await set(rideRef, ride);
            activeRideId = rideRef.key;
            activeRide = { ...ride, id: rideRef.key };
            currentView = 'bidding';
            render();
            toast('تم بث الطلب للسواقين');
          } catch (e) { console.error(e); toast('تعذر إنشاء الرحلة'); }
        };
      }

      if (currentView === 'bidding') {
        if (!activeRideId) {
          addListener('rides', 'value', (snap) => {
            const rides = snap.val() || {};
            const mine = Object.entries(rides).find(([id,r]) => r.riderId === session.uid && (r.status === 'open' || r.status === 'accepted'));
            if (mine) {
              activeRideId = mine[0];
              activeRide = { ...mine[1], id: mine[0] };
              if (activeRide.status === 'accepted') { currentView = 'tracking'; render(); }
              else render();
            }
          });
          return;
        }
        // listen to ride status (for acceptance)
        addListener(`rides/${activeRideId}`, 'value', (snap) => {
          const r = snap.val();
          if (!r) return;
          activeRide = { ...r, id: activeRideId };
          if (r.status === 'accepted') {
            currentView = 'tracking';
            render();
          }
        });
        // listen to offers
        addListener(`rides/${activeRideId}/offers`, 'value', (snap) => {
          const offers = snap.val() || {};
          const list = Object.entries(offers).map(([uid, o]) => `
            <div class="card offer">
              <div class="avatar">${esc((o.driverName||'س')[0])}</div>
              <div class="offer-main">
                <div class="offer-name">${esc(o.driverName||'سائق')} <span class="badge">عرض</span></div>
                <div class="meta">${o.distance ? o.distance.toFixed(2)+' كم · ' : ''}أرسل عرضه ${o.createdAt?'الآن':''}</div>
              </div>
              <div class="price">${o.price} ج</div>
              <div class="actions"><button class="btn primary" data-accept="${uid}">موافقة</button></div>
            </div>`);
          const el = $('#offersList');
          if (el) el.innerHTML = list.length ? list.join('') : '<div class="card"><p class="sub">في انتظار عروض السواقين...</p></div>';
          $$('[data-accept]').forEach(b => b.onclick = async () => {
            const uid = b.dataset.accept;
            const offerSnap = await get(ref(db, `rides/${activeRideId}/offers/${uid}`));
            const offer = offerSnap.val();
            if (!offer) return;
            await update(ref(db, `rides/${activeRideId}`), {
              status: 'accepted',
              driverId: uid,
              driverName: offer.driverName,
              agreedPrice: offer.price,
              acceptedAt: serverTimestamp()
            });
            toast('تم قبول العرض، السائق في الطريق');
          });
        });
      }

      if (currentView === 'tracking') {
        if (!activeRide) return;
        if (!currentLocation) {
          const iv = setInterval(() => { if (currentLocation) { clearInterval(iv); render(); } }, 700);
          setTimeout(() => clearInterval(iv), 15000);
          return;
        }
        initMap('map', currentLocation, null);
        setDestinationMarker(activeRide.dropoff.lat, activeRide.dropoff.lng);
        if (myMarker) myMarker.bindTooltip('أنت');

        const driverId = activeRide.driverId;
        if (driverId) {
          addListener(`drivers/${driverId}/location`, 'value', (snap) => {
            const loc = snap.val();
            if (!loc) return;
            if (!driverMarkers[driverId]) {
              driverMarkers[driverId] = L.marker([loc.lat, loc.lng], {
                icon: L.divIcon({ className:'', html:`<div style="width:30px;height:30px;background:#0b8f68;border:3px solid #fff;border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.3)"></div>`, iconSize:[30,30], iconAnchor:[15,15] })
              }).addTo(mapInstance).bindTooltip(activeRide.driverName || 'سائق');
            } else {
              driverMarkers[driverId].setLatLng([loc.lat, loc.lng]);
            }
            if (currentLocation) {
              const km = haversineKm(currentLocation, { lat: loc.lat, lng: loc.lng });
              const el = $('#trackDistance');
              if (el) el.textContent = `يبعد عنك ${km.toFixed(2)} كم`;
            }
          });
        }
        addListener(`rides/${activeRide.id}`, 'value', (snap) => {
          const r = snap.val();
          if (!r) return;
          activeRide = { ...r, id: activeRide.id };
          const st = $('#trackStatus');
          if (st) st.textContent = 'الحالة: ' + (r.status === 'accepted' ? 'السائق في الطريق' : r.status);
          if (r.status === 'completed') {
            toast('الرحلة انتهت');
            setTimeout(() => { activeRide = null; activeRideId = null; currentView = 'overview'; render(); }, 1500);
          }
        });
      }
    }

    // ============ DRIVER BIND ============
    function driverTracking(){
      return `<section>${header('رحلة نشطة','في الطريق للراكب.')}<div class="card"><div id="map" class="map"></div><div id="trackDistance" class="notice" style="margin-top:14px">جاري حساب المسافة...</div><button class="btn primary full" style="margin-top:12px" id="finishRide">إنهاء الرحلة</button></div></section>`;
    }

    function bindDriverViews(){
      if (currentView === 'onboarding') { bindDriverOnboarding(); return; }

      if (currentView === 'tracking') {
        if (!activeRide) { currentView = 'overview'; render(); return; }
        if (!currentLocation) {
          const iv = setInterval(() => { if (currentLocation) { clearInterval(iv); render(); } }, 700);
          setTimeout(() => clearInterval(iv), 15000);
          return;
        }
        initMap('map', currentLocation, null);
        if (myMarker) myMarker.bindTooltip('موقعك');
        setDestinationMarker(activeRide.pickup.lat, activeRide.pickup.lng);
        if (destMarker) destMarker.bindTooltip('موقع الراكب');

        const el = $('#trackDistance');
        const updateDist = () => {
          if (!currentLocation) return;
          const km = haversineKm(currentLocation, activeRide.pickup);
          if (el) el.textContent = `تبعد عن الراكب ${km.toFixed(2)} كم`;
        };
        updateDist();
        const iv = setInterval(updateDist, 4000);

        $('#finishRide').onclick = async () => {
          await update(ref(db, `rides/${activeRide.id}`), { status: 'completed', completedAt: serverTimestamp() });
          clearInterval(iv);
          activeRide = null; activeRideId = null;
          toast('تم إنهاء الرحلة');
          currentView = 'overview'; render();
        };

        addListener(`rides/${activeRide.id}`, 'value', (snap) => {
          const r = snap.val();
          if (!r) return;
          if (r.status === 'completed' || r.status === 'cancelled') {
            activeRide = null; activeRideId = null;
            clearInterval(iv);
            currentView = 'overview'; render();
          }
        });
        return;
      }

      // overview
      if (!currentLocation) {
        const iv = setInterval(() => { if (currentLocation) { clearInterval(iv); render(); } }, 700);
        setTimeout(() => clearInterval(iv), 15000);
        return;
      }
      initMap('map', currentLocation, null);
      if (myMarker) myMarker.bindTooltip('موقعك');

      // if there's an accepted ride for me → go to tracking
      addListener('rides', 'value', (snap) => {
        const rides = snap.val() || {};
        const mine = Object.entries(rides).find(([id,r]) => r.driverId === session.uid && r.status === 'accepted');
        if (mine) {
          activeRideId = mine[0];
          activeRide = { ...mine[1], id: mine[0] };
          currentView = 'tracking';
          render();
          return;
        }
        // open rides list
        const open = Object.entries(rides)
          .filter(([id,r]) => r.status === 'open' && r.riderId !== session.uid)
          .map(([id,r]) => ({ id, ...r }))
          .map(r => {
            const dist = (currentLocation && r.pickup) ? haversineKm(currentLocation, r.pickup).toFixed(2) : '—';
            const toDist = (r.pickup && r.dropoff) ? haversineKm(r.pickup, r.dropoff).toFixed(2) : '—';
            return `<div class="card">
              <div class="offer" style="margin-bottom:10px">
                <div class="avatar">${esc((r.riderName||'ر')[0])}</div>
                <div class="offer-main">
                  <div class="offer-name">${esc(r.riderName||'راكب')} <span class="badge orange">طلب جديد</span></div>
                  <div class="meta">منك ${dist} كم · الرحلة ${toDist} كم</div>
                </div>
                <div class="price">${r.suggestedPrice} ج</div>
              </div>
              <div class="meta" style="margin-bottom:10px"><b>من:</b> ${esc(r.pickupAddress || '—')}<br/><b>إلى:</b> ${esc(r.dropoffAddress || '—')}</div>
              <div class="actions">
                <input class="input" style="max-width:120px" type="number" value="${r.suggestedPrice}" min="5" id="offer_${r.id}"/>
                <button class="btn primary" data-offer="${r.id}">إرسال عرض</button>
              </div>
            </div>`;
          });
        const el = $('#openRides');
        if (el) el.innerHTML = open.length ? open.join('') : '<div class="card"><p class="sub">لا توجد طلبات مفتوحة دلوقتي. استنى شوية...</p></div>';
        $$('[data-offer]').forEach(b => b.onclick = async () => {
          const rideId = b.dataset.offer;
          const priceInput = document.getElementById('offer_' + rideId);
          const price = Number(priceInput.value);
          if (!price || price < 5) return toast('اكتب سعر صحيح');
          const dist = currentLocation ? haversineKm(currentLocation, rides[rideId].pickup) : null;
          try {
            await set(ref(db, `rides/${rideId}/offers/${session.uid}`), {
              driverId: session.uid,
              driverName: session.name,
              price,
              distance: dist,
              createdAt: serverTimestamp()
            });
            toast('تم إرسال عرضك للراكب');
            b.textContent = 'تم الإرسال ✓';
            b.disabled = true;
          } catch (e) { console.error(e); toast('تعذر إرسال العرض'); }
        });
      });

      // online toggle
      const toggle = $('#onlineToggle');
      if (toggle) {
        toggle.onchange = async () => {
          isOnline = toggle.checked;
          try {
            await update(ref(db, `drivers/${session.uid}`), {
              name: session.name,
              online: isOnline,
              updatedAt: serverTimestamp()
            });
            if (isOnline && currentLocation) {
              await set(ref(db, `drivers/${session.uid}/location`), {
                lat: currentLocation.lat, lng: currentLocation.lng, updatedAt: serverTimestamp()
              });
            }
          } catch (e) { console.error(e); }
          render();
        };
      }
    }

    // ---------- AUTH STATE ----------
    onAuthStateChanged(auth, (user) => {
      if (user && !session) {
        session = { uid: user.uid, name: user.displayName || user.email || 'مستخدم', accountType: selectedRole };
        localStorage.setItem('tukgo-session', JSON.stringify(session));
        startGpsWatch();
        render();
      }
    });

    render();
    startGpsWatch();
  </script>
</body>
</html>
